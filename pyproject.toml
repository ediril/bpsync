[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "wpsync"
dynamic = ["version"]
description = "Manage blog posts as local Markdown files"
readme = "README.md"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "html5lib>=1.1,<2",
  "httpx>=0.28,<1",
  "markdown-it-py>=3,<5",
  "mdit-py-plugins>=0.5,<1",
  "PyYAML>=6,<7",
  "tzdata; sys_platform == 'win32'",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[project.scripts]
wpsync = "wpsync.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "twine>=6,<7"]

[tool.hatch.version]
source = "code"
path = "build_backend/versioning.py"
expression = "release_version()"

# Twine and PyPI accept core metadata up to 2.4, which License-Expression needs.
[tool.hatch.build.targets.wheel]
packages = ["src/wpsync"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
include = ["src/wpsync", "build_backend", "version.json", "README.md", "LICENSE"]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
# The version comes from version.json and Git history, so rebuild when they change.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "version.json" },
  { git = { commit = true } },
]
